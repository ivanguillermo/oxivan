<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PWA con Google Sheets - Borrar Mensajes</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px auto; padding: 0 10px; }
    form { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    input, button { padding: 8px; font-size: 16px; }
    
    .item-mensaje {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f4f4f4;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 4px;
    }
    .btn-borrar {
      background-color: #ff4d4d;
      color: white;
      border: none;
      padding: 5px 10px;
      border-radius: 3px;
      cursor: pointer;
    }
    .btn-borrar:hover { background-color: #cc0000; }
  </style>
</head>
<body>

  <h2>Gestor de Mensajes</h2>

  <form id="miFormulario">
    <input type="text" id="nombre" placeholder="Tu nombre" required>
    <input type="text" id="mensaje" placeholder="Tu mensaje" required>
    <button type="submit" id="btnGuardar">Guardar y Actualizar</button>
  </form>

  <h3>Datos Actuales:</h3>
  <div id="datos">Cargando...</div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxd-bJeW4d5niMGTFSzXvLJFaKUfVpvuphJN252b1JL3cJdlZvr5A19NakWFIGzxhpO/exec';

    // Leer datos y renderizar cada item con un botón de eliminar
    async function cargarDatos() {
      const contenedor = document.getElementById('datos');
      contenedor.innerText = 'Cargando datos frescos...';
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        
        if (!data || data.length === 0) {
          contenedor.innerHTML = '<p>No hay datos guardados.</p>';
          return;
        }

        contenedor.innerHTML = data.map(item => `
          <div class="item-mensaje">
            <div>
              <strong>${item.Nombre}:</strong> ${item.Mensaje}
            </div>
            <button class="btn-borrar" onclick="borrarMensaje(${item.rowIndex})">Eliminar</button>
          </div>
        `).join('');
      } catch (err) {
        contenedor.innerText = 'Error al cargar los datos.';
        console.error(err);
      }
    }

    // Enviar nuevo mensaje
    document.getElementById('miFormulario').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnGuardar');
      btn.disabled = true;
      btn.innerText = 'Guardando...';

      const payload = {
        nombre: document.getElementById('nombre').value,
        mensaje: document.getElementById('mensaje').value
      };

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        document.getElementById('miFormulario').reset();
        await cargarDatos();
      } catch (err) {
        alert('Error al enviar los datos.');
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Guardar y Actualizar';
      }
    });

    // Función para borrar un mensaje según su fila
    async function borrarMensaje(rowIndex) {
      if (!confirm('¿Estás seguro de eliminar este mensaje?')) return;

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'delete',
            rowIndex: rowIndex
          })
        });

        // Releer el sheet para recalcular los índices de las filas y mostrar el contenido actualizado
        await cargarDatos();
      } catch (err) {
        alert('Error al eliminar el mensaje.');
        console.error(err);
      }
    }

    // Carga inicial
    cargarDatos();
  </script>
</body>
</html>
